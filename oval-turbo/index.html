<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Oval Turbo</title>
<meta name="theme-color" content="#15161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Corrida no oval com curvas inclinadas, estilo Enduro. Online com a galera.">
<meta name="apple-mobile-web-app-title" content="Oval Turbo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: fliperama de corrida, alto contraste, energia de largada
   IDEA: o Enduro do Atari levado para um oval com curvas inclinadas
   PICTURE: a própria pista em pseudo-3D ocupando a tela inteira
   COLOUR and TYPE: asfalto grafite, vermelho de corrida, amarelo de bandeira; Bungee + Nunito
   LAYOUT: pista em tela cheia, painel no topo, pedais nos cantos inferiores */
:root{--ink:#15161a;--red:#e3262f;--yel:#ffcc00;--panel:#fff;--mut:#5d6470}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#15161a;color:#fff;font:600 15px/1.3 Nunito,system-ui,sans-serif;overflow:hidden;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.box{background:rgba(10,10,14,.72);border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:5px 10px;font:400 14px Bungee,sans-serif;white-space:nowrap}
.box small{display:block;font:800 10px Nunito,sans-serif;color:#aab;letter-spacing:.04em}
#spd{margin-left:auto;text-align:right;font-size:22px}
#spd small{text-align:right}
.hb{pointer-events:auto;border:0;cursor:pointer;color:#fff}
#pedals{position:absolute;left:0;right:0;bottom:0;padding:0 calc(12px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.grp{display:flex;gap:10px;align-items:flex-end}
.pd{pointer-events:auto;border:0;border-radius:20px;font:400 15px Bungee,sans-serif;color:#fff;width:96px;height:96px;box-shadow:0 5px 0 rgba(0,0,0,.45);touch-action:none;cursor:pointer;opacity:.88}
.pd.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45);opacity:1}
#gas{background:linear-gradient(#3bd16f,#1c9a48);width:110px;height:130px}
#tur{background:linear-gradient(#ff9a1f,#d4560b);font-size:13px;line-height:1.1}
#tur.off{filter:grayscale(1) brightness(.7);opacity:.6}
#tur b{display:block;font-size:22px}
.str{background:rgba(255,255,255,.25);width:92px;height:96px;font-size:30px}
#cdown{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font:400 72px Bungee,sans-serif;color:var(--yel);text-shadow:0 4px 0 #000;pointer-events:none}
#msg{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(10,10,14,.8);padding:6px 14px;border-radius:12px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:90%}
#msg.show{opacity:1}
#overlay{position:fixed;inset:0;background:rgba(10,10,14,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5;touch-action:auto}
#overlay.hide{display:none}
.card{background:#fff;color:var(--ink);border-radius:22px;padding:20px;max-width:420px;width:100%;max-height:94dvh;overflow:auto;text-align:center;border:5px solid var(--ink);box-shadow:0 0 0 4px var(--yel),0 14px 34px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
.card h1{font:400 38px/1 Bungee,sans-serif;margin:4px 0 8px;color:var(--red)}
.card h2{font:400 26px/1.1 Bungee,sans-serif;margin:0 0 8px}
.card p{margin:8px 0;color:var(--mut)}
.flag{height:14px;margin:-6px -6px 12px;border-radius:10px;background:repeating-conic-gradient(#15161a 0 25%,#fff 0 50%) 0 0/14px 14px}
.cta{display:block;width:100%;margin-top:10px;min-height:48px;border:0;border-radius:14px;font:400 16px Bungee,sans-serif;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 4px 0 #8f1218}
.cta.alt{background:var(--ink);box-shadow:0 4px 0 #000}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;text-align:left}
.num{display:flex;align-items:center;gap:6px}
.sb{width:44px;height:44px;border-radius:12px;border:0;background:#eceef2;font-size:20px;font-weight:800;color:var(--ink);cursor:pointer}
.num input,.tin{height:44px;text-align:center;font:800 18px Nunito,sans-serif;border:2px solid #d5d9e0;border-radius:12px;color:var(--ink);width:64px}
.tin{width:100%;text-align:left;padding:0 12px;font-size:16px}
.codein{flex:1;height:48px;border:2px solid var(--ink);border-radius:12px;text-align:center;font:400 22px Bungee,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--ink)}
.sw{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d5d9e0;cursor:pointer}
.sw button.sel{box-shadow:0 0 0 3px var(--ink)}
.seg{display:flex;border-radius:12px;overflow:hidden;border:2px solid var(--ink)}
.seg button{border:0;background:#fff;padding:0 12px;height:40px;font:800 14px Nunito,sans-serif;color:var(--ink);cursor:pointer}
.seg button.sel{background:var(--ink);color:#fff}
.code{font:400 44px/1 Bungee,sans-serif;letter-spacing:.12em;background:#f1f2f5;border-radius:16px;padding:14px 8px;margin:8px 0}
.link{font-size:13px;word-break:break-all;background:#f6f7f9;border-radius:10px;padding:8px;color:var(--ink)!important}
table{width:100%;border-collapse:collapse;margin:10px 0;text-align:left;font-size:14px}
td{padding:7px 4px;border-bottom:1px solid #eceef2}
td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
small{color:var(--mut)}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
@media (orientation:portrait){.pd{width:80px;height:80px;font-size:13px}#gas{width:92px;height:110px}.str{width:68px;height:68px}}
#rot{position:fixed;inset:0;z-index:8;background:#15161a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;font:400 20px/1.2 Bungee,sans-serif}
#rot p{font:600 15px Nunito,sans-serif;color:#aab;margin:0;max-width:300px}
#rot i{display:block;width:70px;height:110px;border:6px solid #fff;border-radius:14px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.racing #rot{display:flex}}
@media (prefers-reduced-motion:reduce){#msg{transition:none}#rot i{animation:none;transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="game">
 <canvas id="cv"></canvas>
 <div id="hud">
  <button class="box hb" id="menuBtn" aria-label="Pausa">II</button>
  <div class="box"><small>VOLTA</small><span id="hLap">1/3</span></div>
  <div class="box" id="posBox" hidden><small>POSIÇÃO</small><span id="hPos">1º</span></div>
  <div class="box"><small>TEMPO</small><span id="hTime">0:00,0</span></div>
  <div class="box" id="passBox"><small>PASSOU</small><span id="hPass">0</span></div>
  <button class="box hb" id="ctrBtn" hidden><small>INCLINAÇÃO</small>Centrar</button>
  <div class="box" id="drBox" hidden style="background:#1f6fe0;margin-left:auto"><small>VÁCUO</small>ativo</div>
  <div class="box" id="spd"><small>KM/H</small><span id="hSpd">0</span></div>
 </div>
 <div id="cdown"></div>
 <div id="msg"></div>
 <div id="pedals">
  <div class="grp"><button class="pd str" id="lft" aria-label="Esquerda">◀</button><button class="pd str" id="rgt" aria-label="Direita">▶</button></div>
  <div class="grp"><button class="pd" id="tur" hidden>TURBO<b id="turN">2</b></button><button class="pd" id="gas">ACELERA</button></div>
 </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>
<div id="rot"><i></i>Gire para a horizontal<p>O Oval Turbo é jogado com o aparelho deitado. Se a tela não girar, desligue o bloqueio de rotação do aparelho.</p></div>

<script>
{
const $=id=>document.getElementById(id);
const cv=$('cv'); let ctx=cv.getContext('2d');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mod=(a,m)=>((a%m)+m)%m, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const fmtT=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1).replace('.',',')};

// ===== PISTA =====
const SEG=200, RW=2000, CAM_H=2400, FOV=110, camDepth=1/Math.tan(FOV/2*Math.PI/180), DRAW=230, playerZ=CAM_H*camDepth;
const MAXS=SEG*32, ACC=MAXS/4.5, BRK=-MAXS*1.2, DEC=-MAXS/4.5, OFF=MAXS/3, CENT=0.42, CARW=0.36, WALL_H=700, KMH=320;
const PAL={light:{road:'#6e6f75',grass:'#2f9e44',apron:'#a3a4aa',out:'#3b3c42',wall:'#e2e3e7',rumble:'#e3262f'},dark:{road:'#66676d',grass:'#2a8d3d',apron:'#96979d',out:'#35363c',wall:'#cfd0d5',rumble:'#f4f4f4'}};
let segs=[], L=0, START=0;
const easeIn=(a,b,p)=>a+(b-a)*p*p, easeIO=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+.5);
function addSeg(curve,bank,tight){const n=segs.length;segs.push({i:n,curve,bank,tight,p1:{z:n*SEG,s:{}},p2:{z:(n+1)*SEG,s:{}},c:Math.floor(n/3)%2?PAL.dark:PAL.light,f:-1})}
function addRoad(e,h,l,c,b,t){for(let n=0;n<e;n++)addSeg(easeIn(0,c,n/e),easeIO(0,b,n/e),t);for(let n=0;n<h;n++)addSeg(c,b,t);for(let n=0;n<l;n++)addSeg(easeIO(c,0,n/l),easeIO(b,0,n/l),t)}
// oval: reta, curvas 1-2 FECHADAS (precisa tirar o pé), reta oposta, curvas 3-4 abertas (dá de pé embaixo, com braço)
addRoad(0,280,0,0,0);addRoad(50,120,50,-4.6,1,true);addRoad(0,280,0,0,0);addRoad(70,100,70,-2.6,1,false);
L=segs.length*SEG; START=140*SEG;
const segAt=z=>segs[Math.floor(mod(z,L)/SEG)];

// ===== ESTADO =====
let prefs={name:'',color:'#e3262f',model:'stock',num:7,oil:true,npc:true,rain:false,steer:'',inv:false,sens:20,laps:3,best:{}};
try{prefs=Object.assign(prefs,JSON.parse(localStorage.getItem('ovalturbo')||'{}'))}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('ovalturbo',JSON.stringify(prefs))}catch(e){}};
const hasTilt='DeviceMotionEvent' in window&&('ontouchstart' in window||navigator.maxTouchPoints>0);
if(!prefs.steer)prefs.steer='buttons';
const CARCOLS=['#e3262f','#1f6fe0','#ffcc00','#22b35a','#ff7a00','#8a3ffc','#f2f2f2','#15161a'];
let R=null, frame=0, cw=0, ch=0, bgOff=0, shake=0, sparks=0, traffic=[];
const keys={}, btn={gas:0,lft:0,rgt:0};

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeTraffic(seed){
 const r=rng(seed), cols=['#9aa3ad','#4c79c9','#f5f5f5','#2f8f6b','#c9a227','#8c5a3c','#b04a8f','#5ac8e0'], out=[];
 for(let i=0;i<14;i++)out.push({z0:START+3000+i*(L/14)+r()*3000,x:[-0.66,0,0.66][Math.floor(r()*3)],s:MAXS*(0.32+r()*0.28),col:cols[Math.floor(r()*cols.length)],num:10+Math.floor(r()*89),model:['stock','stock','gt','formula'][Math.floor(r()*4)],prev:null});
 return out;
}
const tz=c=>mod(c.z0+c.s*(R?R.t:0),L);
let oil=[];
function makeOil(seed){
 const r=rng(seed*7+3), out=[];
 for(let i=0;i<7;i++)out.push({z:mod(START+6000+i*(L/7)+r()*(L/10),L),x:[-0.62,0,0.62][Math.floor(r()*3)]+(r()-.5)*0.2,last:-1});
 return out;
}

// chuva: começa e para em momentos sorteados (iguais para todos da sala, pela mesma semente)
function makeRain(seed){
 const r=rng(seed*13+5), out=[]; let t=15+r()*35;
 while(t<7200){const d=25+r()*45;out.push([t,t+d]);t+=d+30+r()*50}
 return out;
}
function rainAt(t){
 if(!R||!R.rainSched)return 0;
 for(const [a,b] of R.rainSched){if(t<a-4)return 0;if(t<=b+4)return clamp(Math.min(t-a+4,b+4-t)/4,0,1)}
 return 0;
}
function newRace(laps,seed,online,opts){
 opts=opts||{oil:prefs.oil,npc:prefs.npc,rain:prefs.rain};
 traffic=opts.npc?makeTraffic(seed):[]; oil=opts.oil?makeOil(seed):[];
 R={laps,seed,online,t:0,cd:3.6,run:false,dist:0,speed:0,x:online?[-0.66,0,0.66][Math.max(0,net.me)%3]:0,lapIdx:0,lapStart:0,best:null,passes:0,fin:false,steer:0,draft:false,turbos:2,turboT:0,oilT:0,opts,rain:0,rainSched:opts.rain?makeRain(seed):null};
 if(online)R.dist=-Math.floor(Math.max(0,net.me)/3)*900;
 tilt.ok=false; document.body.classList.add('racing'); lockLandscape();
 $('posBox').hidden=!online; $('passBox').hidden=!!online; $('ctrBtn').hidden=prefs.steer!=='tilt';
 $('lft').hidden=$('rgt').hidden=prefs.steer!=='buttons';
 hide(); wake(); sound.start();
 tiltNoData=false;
 if(prefs.steer==='tilt')setTimeout(()=>{if(R&&!tilt.ok&&!tiltNoData)tiltFail('O jogo não está recebendo o sensor de movimento do aparelho.')},2500);
}

// ===== INCLINAÇÃO DO APARELHO =====
// volante: mede o quanto o aparelho girou (em torno do eixo que sai da tela)
// em relação à posição da largada. Não depende de o aparelho informar a orientação da tela,
// e funciona igual no Android e no iPhone (que medem a gravidade com sinais opostos).
const tilt={gx:0,gy:0,bx:0,by:1,ok:false}; let meterT=0;
function onMotion(e){
 const g=e.accelerationIncludingGravity; if(!g||g.x==null||g.y==null)return;
 if(!tilt.ok){tilt.ok=true;tilt.gx=g.x;tilt.gy=g.y;tilt.bx=g.x;tilt.by=g.y;return}
 tilt.gx=tilt.gx*0.6+g.x*0.4; tilt.gy=tilt.gy*0.6+g.y*0.4;
}
function tiltAngle(){
 const m1=Math.hypot(tilt.gx,tilt.gy), m0=Math.hypot(tilt.bx,tilt.by);
 if(m1<2||m0<2)return 0;
 const cross=tilt.bx*tilt.gy-tilt.by*tilt.gx, dot=tilt.bx*tilt.gx+tilt.by*tilt.gy;
 return Math.atan2(cross,dot)*180/Math.PI; // positivo = girou no sentido horário = direita
}
function setCenter(){if(tilt.ok){tilt.bx=tilt.gx;tilt.by=tilt.gy}}
async function askTilt(){
 if(prefs.steer!=='tilt')return true;
 try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){const p=await DeviceMotionEvent.requestPermission();if(p!=='granted'){tiltFail('O aparelho não liberou o sensor de movimento.');return true}}}catch(e){}
 window.addEventListener('devicemotion',onMotion);
 return true;
}
let tiltNoData=false;
function tiltFail(why){
 tiltNoData=true; $('lft').hidden=$('rgt').hidden=false; $('ctrBtn').hidden=true;
 card(`<h2>Inclinação indisponível</h2><p>${why}</p><p>Isso acontece quando o jogo é aberto dentro de outro app (como aqui no Claude), que bloqueia o sensor. Abra pelo link do jogo no navegador (Safari ou Chrome) ou instalado na tela inicial.</p><p>Por enquanto, use os botões ◀ ▶.</p><button class="cta" id="ok">Entendi</button>`);
 $('ok').onclick=hide;
}
function canTurbo(){return R&&R.run&&!R.fin&&R.online&&myPos()>1}
function useTurbo(){
 if(!R||!R.run||R.fin)return;
 if(!R.online||myPos()===1){say('Quem lidera não pode usar turbo.');return}
 if(R.turbos<=0){say('Sem turbo nesta volta.');return}
 if(R.turboT>0)return;
 R.turbos--;R.turboT=3;beep(220,.5,'sawtooth');say('TURBO!');
}
function centerTilt(){setCenter();say('Volante centralizado')}

// ===== FÍSICA =====
function steerInput(){
 let s=0;
 if(keys.ArrowLeft||keys.KeyA||btn.lft)s-=1;
 if(keys.ArrowRight||keys.KeyD||btn.rgt)s+=1;
 if(!s&&prefs.steer==='tilt'&&tilt.ok){let d=tiltAngle()*(prefs.inv?-1:1);d=Math.abs(d)<2?0:d-Math.sign(d)*2;s=clamp(d/(prefs.sens||20),-1,1)}
 return s;
}
let rainDrops=[];
function update(dt){
 if(!R)return;
 {const was=R.rain>0.5;R.rain=rainAt(R.t);const now=R.rain>0.5;if(R.run&&now!==was)say(now?'Começou a chover! Curvas escorregadias.':'A chuva parou.')}
 bgOff+=0; shake=Math.max(0,shake-dt*3); sparks=Math.max(0,sparks-dt*4);
 if(!R.run){
  if(R.cd>0){R.cd-=dt;if(R.cd<=0){R.run=true;R.lapStart=0;beep(880,.35);if(prefs.steer==='tilt'&&tilt.ok)setCenter()}}
  return;
 }
 R.t+=dt;
 const P=mod(START+R.dist,L), seg=segAt(P), sp=R.speed/MAXS, dx=dt*2*sp;
 const gas=keys.ArrowUp||keys.KeyW||keys.Space||btn.gas, brk=keys.ArrowDown||keys.KeyS;
 R.steer=R.fin?0:steerInput();
 // força centrífuga cresce com o quadrado da velocidade; a inclinação ajuda, mas não resolve sozinha
 // na chuva a direção responde menos e a curva empurra mais para fora
 R.x+=dx*R.steer*(1-0.15*R.rain);
 R.x-=dx*sp*seg.curve*CENT*(1-0.35*seg.bank)*(1+0.4*R.rain);
 if(R.x>-1&&R.x<1)R.x-=dt*0.35*seg.bank*Math.max(0,0.5-sp);
 bgOff+=seg.curve*sp*dt*0.6;
 // até 320 km/h o carro acelera normalmente. Acima disso, de pé embaixo:
 // na reta ganha 1 km/h por segundo (quem está atrás, no vácuo, 1 km/h a cada meio segundo);
 // na curva perde 1 km/h a cada 2 segundos. Nada se acumula: tirou o pé, perdeu, recomeça.
 const inCurve=Math.abs(seg.curve)>0.5, K=MAXS/KMH;
 const pos=R.online&&!R.fin?myPos():1;
 R.draft=!inCurve&&pos>1&&!R.fin;
 const gain=pos===1?1:pos===2?3:5; // km/h por segundo acima de 320, na reta
 if(R.fin)R.speed+=DEC*1.5*dt;
 else if(brk)R.speed+=BRK*dt;
 else if(gas){
  if(R.speed<MAXS)R.speed=Math.min(MAXS,R.speed+ACC*dt*(1-0.55*sp));
  else if(inCurve)R.speed=Math.max(MAXS*0.9,R.speed-K*0.5*dt);
  else R.speed+=K*dt*gain;
 }
 else R.speed+=DEC*dt;
 // turbo: +10 km/h por segundo durante 3 s
 if(R.turboT>0){R.turboT-=dt;if(!R.fin)R.speed+=K*10*dt}
 // poça de óleo: perde velocidade e o carro escorrega
 R.oilT=Math.max(0,R.oilT-dt);
 {const Pn=mod(START+R.dist,L);for(const o of oil){const rel=mod(o.z-Pn,L),srel=rel>L/2?rel-L:rel;if(Math.abs(srel)<260&&Math.abs(o.x-R.x)<0.3&&o.last!==R.lapIdx&&!R.fin){o.last=R.lapIdx;R.speed*=0.78;R.oilT=0.8;R.slide=(Math.random()<.5?-1:1)*0.9;shake=0.6;beep(70,.3,'sawtooth');say('Óleo na pista!')}}}
 if(R.oilT>0)R.x+=(R.slide||0)*dt*R.oilT;
 if(R.x<-1.12&&R.speed>OFF)R.speed=Math.max(OFF,R.speed-MAXS*1.1*dt);

const net={on:false,host:false,peer:null,conns:new Map(),hostConn:null,me:-1,code:'',sendT:0};
let lobby={laps:3,players:[],started:false,seed:0,opts:{npc:true,oil:true,rain:false}}, posts=[];
const CODE_CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:5},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');
const peerId=c=>'ovalturbo-v1-'+c.toLowerCase();
const roomLink=()=>location.origin+location.pathname+'#sala-'+net.code;
function loadPeer(){
 if(window.Peer)return Promise.resolve();
 const add=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});

}
function resetNet(){try{net.peer&&net.peer.destroy()}catch(e){}Object.assign(net,{on:false,host:false,peer:null,conns:new Map(),hostConn:null,me:-1,code:''});lobby={laps:prefs.laps,players:[],started:false,seed:0,opts:{npc:prefs.npc,oil:prefs.oil,rain:prefs.rain}};posts=[]}
function onlineMenu(code=''){
 card(`<h2>ONLINE</h2><p>Cada um corre no próprio aparelho. Uma pessoa cria a sala e os outros entram com o código.</p>
 <div class="field"><b>Seu nome</b><input id="myName" class="tin" style="max-width:60%" maxlength="14" placeholder="Nome" value="${esc(prefs.name||'')}"></div>
 ${carFields()}
 <button class="cta" id="host">Criar sala</button>
 <div class="field" style="margin-top:16px"><input id="roomCode" class="codein" maxlength="5" placeholder="CÓDIGO" value="${esc(code)}" autocapitalize="characters" aria-label="Código da sala"><button class="cta alt" id="join" style="margin:0;width:auto;padding:0 18px">Entrar</button></div>
 <button class="cta alt" id="bk">Voltar</button>`);
 bindCar();
 const nm=()=>{const v=$('myName').value.trim();if(!v){say('Digite seu nome primeiro.');$('myName').focus();return''}prefs.name=v;savePrefs();return v};
 $('host').onclick=()=>{const v=nm();if(v){sound.start();lockLandscape();askTilt();hostRoom()}};
 $('join').onclick=()=>{const v=nm();if(!v)return;const c=$('roomCode').value.trim().toUpperCase();if(c.length!==5){say('O código tem 5 letras/números.');return}sound.start();lockLandscape();askTilt();joinRoom(c)};
 $('bk').onclick=menu;
}
const me=()=>({name:prefs.name,color:prefs.color,num:prefs.num,model:prefs.model});
function netError(m){resetNet();R=null;card(`<h2>Ops!</h2><p>${m}</p><button class="cta" id="ok">Voltar</button>`);$('ok').onclick=()=>onlineMenu()}
function leave(){unlock();if(net.host)bcast({t:'bye'});resetNet();R=null;sound.stop();history.replaceState(null,'',location.pathname);menu()}
function connecting(m){card(`<h2>Conectando…</h2><p>${m}</p><button class="cta alt" id="cx">Cancelar</button>`);$('cx').onclick=()=>{resetNet();onlineMenu()}}
function lobbyCard(){
 const ps=lobby.players, n=ps.filter(p=>p.on).length;
 card(`<h2>SALA</h2><div class="code">${net.code}</div>
 ${net.host?`<p>Mande o código ou o link para a galera:</p><p class="link">${esc(roomLink())}</p><button class="cta alt" id="cp">Copiar link</button>`:'<p>Você entrou! Aguardando o anfitrião dar a largada.</p>'}
 <table><tbody>${ps.map((p,i)=>`<tr><td><span class="dot" style="background:${p.color}"></span><b>${esc(p.name)}</b> <small>#${p.num}${i===net.me?' · você':''}${i===0?' · anfitrião':''}${p.on?'':' · fora'}</small></td></tr>`).join('')}</tbody></table>
 <div class="field"><b>Voltas</b>${net.host?stepper('l',lobby.laps):`<b>${lobby.laps}</b>`}</div>
 ${optFields(lobby.opts||{npc:true,oil:true,rain:false},net.host)}
 ${net.host?`<button class="cta alt" id="lR" style="margin-top:0">Sortear voltas</button><button class="cta" id="st">Largada! (${n} piloto${n>1?'s':''})</button>`:''}
 <button class="cta alt" id="lv">Sair</button>`);
 $('lv').onclick=leave;
 if(!net.host)return;
 $('cp').onclick=()=>{try{navigator.clipboard.writeText(roomLink()).then(()=>say('Link copiado!'),()=>say('Copie o link acima.'))}catch(e){say('Copie o link acima.')}};
 bindLaps(()=>lobby.laps,v=>{lobby.laps=v;prefs.laps=v;savePrefs();sendLobby()});
 bindOpts(lobby.opts,()=>{Object.assign(prefs,lobby.opts);savePrefs();sendLobby()});
 $('st').onclick=hostStart;
}
function bcast(m){for(const {c} of net.conns.values())if(c.open)try{c.send(m)}catch(e){}}
function sendLobby(){bcast({t:'lobby',lobby});onLobby({lobby})}
async function hostRoom(){
 resetNet(); connecting('Criando a sala.');
 try{await loadPeer()}catch(e){return netError('Não consegui carregar a conexão online. Verifique a internet.')}
 net.host=true; net.code=genCode();
 const peer=new Peer(peerId(net.code)); net.peer=peer;
 peer.on('open',()=>{net.on=true;net.me=0;lobby.players=[{...me(),pid:'host',on:1,d:0,x:0,sp:0,fin:0,time:0}];lobbyCard()});
 peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();hostRoom()}else if(e.type!=='peer-unavailable')netError(e.type==='network'?'Não consegui falar com o servidor do jogo. Verifique a internet e tente de novo.':'Problema na conexão ('+e.type+').')});
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
 peer.on('connection',c=>{c.on('data',d=>hostData(c,d));c.on('close',()=>hostDrop(c))});
}
function hostData(c,d){
 const ps=lobby.players;
 if(d.t==='hello'){
  let nm=String(d.name||'Piloto').slice(0,14), i=ps.findIndex(p=>!p.on&&p.name===nm);
  if(i<0){let b=nm,k=2;while(ps.some(p=>p.name===nm))nm=b+' '+k++;i=ps.length;ps.push({name:nm,color:d.color,num:d.num,model:d.model,pid:c.peer,on:1,d:0,x:0,sp:0,fin:0,time:0})}
  else Object.assign(ps[i],{on:1,pid:c.peer,color:d.color,num:d.num,model:d.model});
  net.conns.set(c.peer,{c,i}); c.send({t:'welcome',me:i,code:net.code});
  say(nm+' entrou na sala'); sendLobby();
  if(lobby.started)c.send({t:'go',lobby,late:1});
 } else if(d.t==='pos'){const e=net.conns.get(c.peer);if(e)Object.assign(ps[e.i],{d:d.d,x:d.x,sp:d.sp})}
 else if(d.t==='fin'){const e=net.conns.get(c.peer);if(e)recordFin(e.i,d.time)}
}
function hostDrop(c){const e=net.conns.get(c.peer);if(!e)return;net.conns.delete(c.peer);lobby.players[e.i].on=0;say(lobby.players[e.i].name+' saiu');sendLobby()}
function hostStart(){
 lobby.players=lobby.players.filter((p,i)=>p.on||i===0);
 for(const [k,o] of net.conns){o.i=lobby.players.findIndex(p=>p.pid===k);try{o.c.send({t:'welcome',me:o.i,code:net.code})}catch(e){}}
 lobby.players.forEach(p=>Object.assign(p,{d:0,x:0,sp:0,fin:0,time:0}));
 lobby.started=true; lobby.seed=Math.floor(Math.random()*1e6);
 const m={t:'go',lobby}; bcast(m); onGo(m);
}
function recordFin(i,time){
 const p=lobby.players[i]; if(p.fin)return;
 p.fin=1+lobby.players.filter(q=>q.fin).length; p.time=time;
 const m={t:'res',players:lobby.players}; bcast(m); onRes(m);
}
async function joinRoom(code){
 resetNet(); connecting('Entrando na sala '+code+'.');
 try{await loadPeer()}catch(e){return netError('Não consegui carregar a conexão online. Verifique a internet.')}
 net.code=code;
 const peer=new Peer(); net.peer=peer;
 peer.on('open',()=>{
  const c=peer.connect(peerId(code),{reliable:true,serialization:'json'}); net.hostConn=c;
  const to=setTimeout(()=>{if(!c.open)netError('Não consegui chegar na sala '+code+'. Confira o código ou peça para o anfitrião manter o jogo aberto.')},12000);
  c.on('open',()=>{clearTimeout(to);c.send({t:'hello',...me()})});
  c.on('data',d=>{
   if(d.t==='welcome'){net.me=d.me;net.on=true}
   else if(d.t==='lobby')onLobby(d);
   else if(d.t==='go')onGo(d);
   else if(d.t==='pos')onPos(d);
   else if(d.t==='res')onRes(d);
   else if(d.t==='bye'){net.on=false;netError('O anfitrião encerrou a sala.')}
  });
  c.on('close',()=>{if(net.on)netError('A conexão com a sala caiu. O anfitrião saiu ou a internet oscilou.')});
 });
 peer.on('error',e=>netError(e.type==='peer-unavailable'?'A sala '+code+' não existe. Confira o código.':'Problema na conexão ('+e.type+').'));
}
function onLobby(d){const was=lobby.started;lobby=d.lobby;if(!lobby.started&&(!R||R.fin||!R.online))lobbyCard();else if(was&&!lobby.started){R=null;lobbyCard()}}
function onGo(d){lobby=d.lobby;posts=lobby.players.map(()=>({d:0,x:0,sp:0,at:performance.now()}));newRace(lobby.laps,lobby.seed,true,lobby.opts||{npc:true,oil:true,rain:false});if(d.late)R.cd=0.01}
function onPos(d){const now=performance.now();d.a.forEach((q,i)=>{if(!posts[i])posts[i]={};Object.assign(posts[i],{d:q[0],x:q[1],sp:q[2],at:now})})}
function netTick(dt){
 net.sendT+=dt; if(net.sendT<0.1)return; net.sendT=0;
 const mine={d:R.dist,x:R.x,sp:R.speed};
 if(net.host){
  Object.assign(lobby.players[0],mine);
  const m={t:'pos',a:lobby.players.map(p=>[Math.round(p.d),+p.x.toFixed(3),Math.round(p.sp)])};
  bcast(m); onPos(m);
 } else if(net.hostConn&&net.hostConn.open)net.hostConn.send({t:'pos',d:Math.round(mine.d),x:+mine.x.toFixed(3),sp:Math.round(mine.sp)});
}
function others(){
 const now=performance.now(),out=[];
 posts.forEach((q,i)=>{
  if(i===net.me||!q||q.at==null)return;const p=lobby.players[i];if(!p||!p.on)return;
  const d=q.d+q.sp*Math.min(0.5,(now-q.at)/1000);
  out.push({z:mod(START+d,L),x:q.x,col:p.color,num:p.num,name:p.name,model:p.model});
 });
 return out;
}
function myPos(){
 let pos=1; const myD=R.dist;
 lobby.players.forEach((p,i)=>{if(i===net.me||!p.on)return;const q=posts[i];if(p.fin&&!R.fin)pos++;else if(q&&!p.fin&&q.d>myD&&!R.fin)pos++;});
 if(R.fin){const f=lobby.players[net.me]&&lobby.players[net.me].fin;return f||pos}
 return pos;
}
function netFinish(){
 if(net.host)recordFin(0,R.t);else net.hostConn&&net.hostConn.send({t:'fin',time:R.t});
 setTimeout(()=>{if(R&&R.fin)resultsCard()},1200);
}
function onRes(d){lobby.players=d.players;if(R&&R.fin&&!$('overlay').classList.contains('hide'))resultsCard()}
function resultsCard(){
 const ps=lobby.players.map((p,i)=>({p,i}));
 ps.sort((a,b)=>(a.p.fin||999)-(b.p.fin||999)||((posts[b.i]||{}).d||0)-((posts[a.i]||{}).d||0));
 const all=lobby.players.every(p=>p.fin||!p.on);
 card(`<h2>${all?'RESULTADO FINAL':'BANDEIRADA!'}</h2><p>${lobby.laps} volta${lobby.laps>1?'s':''}${R.best!=null?' · sua melhor volta '+fmtT(R.best):''}</p>
 <table><tbody>${ps.map(({p,i},k)=>`<tr><td>${p.fin?p.fin+'º':'—'}</td><td><span class="dot" style="background:${p.color}"></span><b>${esc(p.name)}</b>${i===net.me?' <small>· você</small>':''}</td><td class="r">${p.fin?fmtT(p.time):p.on?'na pista · volta '+Math.min(lobby.laps,Math.floor(((posts[i]||{}).d||0)/L)+1):'saiu'}</td></tr>`).join('')}</tbody></table>
 ${net.host?'<button class="cta" id="nv">Nova corrida</button>':'<p>O anfitrião pode iniciar outra corrida.</p>'}
 <button class="cta alt" id="lv">Sair da sala</button>`);
 if($('nv'))$('nv').onclick=()=>{lobby.started=false;R=null;sendLobby()};
 $('lv').onclick=leave;
}

// ===== CONTROLES =====
['gas','lft','rgt'].forEach(id=>{
 const b=$(id),on=v=>{btn[id]=v;b.classList.toggle('on',!!v)};
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}on(1);sound.start()});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>on(0)));
 b.addEventListener('contextmenu',e=>e.preventDefault());
});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape')menu();if(e.code==='KeyT'||e.code==='ShiftLeft')useTurbo();if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
$('menuBtn').onclick=menu;
$('ctrBtn').onclick=centerTilt;
$('tur').addEventListener('pointerdown',e=>{e.preventDefault();useTurbo()});
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){sound.stop();if(R&&!R.online&&R.run&&!R.fin)menu()}else if(R&&R.run)wake()});

resize();
const hm=/^#sala-([A-Z0-9]{5})$/i.exec(location.hash);
hm?onlineMenu(hm[1].toUpperCase()):menu();
requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('../sw.js').catch(()=>{});
}
</script>
</body>
</html>
